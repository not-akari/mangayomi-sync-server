services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mangayomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mangayomi}
      POSTGRES_DB: ${POSTGRES_DB:-mangayomi_sync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mangayomi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: notakari/mangayomi-sync-server:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - avatar_storage:/app/storage

  migrate:
    image: notakari/mangayomi-sync-server:latest
    profiles: ["init"]
    env_file: .env
    entrypoint: []
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  avatar_storage:
